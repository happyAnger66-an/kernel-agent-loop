[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-agent-loop"
version = "0.0.0"
description = "Agent-driven GPU kernel optimization loop with a trusted evaluator"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
cuda = ["cuda-python"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not thor'"
markers = ["thor: needs a Jetson Thor GPU with nvcc and cuda-python"]
